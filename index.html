<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Sör</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c8792a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sör">
<link rel="apple-touch-icon" href="img/logo.png">
<script>
  try {
    const saved = localStorage.getItem('beer-theme');
    const theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  } catch (e) {}
</script>
<style>
  :root{
    --bg:#faf7f2; --bg-card:#ffffff; --bg-elev:#ffffff; --text:#1c1410; --text-dim:#7a6f63;
    --border:#e8e0d5; --accent:#c8792a; --accent-2:#e0a542; --danger:#d64545;
    --shadow:0 2px 10px rgba(0,0,0,.08); --overlay:rgba(20,15,10,.55);
  }
  [data-theme="dark"]{
    --bg:#171310; --bg-card:#231d18; --bg-elev:#2a231c; --text:#f1e9df; --text-dim:#a89a8a;
    --border:#3a2f26; --accent:#e0a542; --accent-2:#f0c070; --danger:#e0685f;
    --shadow:0 2px 10px rgba(0,0,0,.45); --overlay:rgba(0,0,0,.65);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  button,input,select,textarea{font-family:inherit;color:inherit}
  header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--bg);border-bottom:1px solid var(--border)}
  header h1{font-size:1rem;margin:0;display:flex;align-items:center;gap:8px;min-width:0;line-height:1.2}
  header h1 span{overflow-wrap:break-word}
  header h1 .logo{width:28px;height:28px;border-radius:8px;object-fit:cover;flex:0 0 auto}
  #themeBtn{background:none;border:none;font-size:1.3rem;cursor:pointer;padding:4px}
  .headerRight{display:flex;align-items:center;gap:10px;flex:0 0 auto}
  .avatarBtn{width:34px;height:34px;border-radius:50%;border:none;padding:0;cursor:pointer;background:var(--accent);color:#1c1410;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;overflow:hidden;flex:0 0 auto}
  .avatarBtn img{width:100%;height:100%;object-fit:cover}

  #toolbar{position:sticky;top:53px;z-index:19;background:var(--bg);padding:10px 12px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  #searchInput{flex:1 1 140px;min-width:0}
  #sortSelect,#typeSelect{flex:1;min-width:0}
  input,select,textarea{background:var(--bg-elev);border:1px solid var(--border);border-radius:10px;padding:9px 11px;font-size:.92rem;color:var(--text)}
  select{cursor:pointer}

  #beerList{padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px;padding-bottom:90px}
  .card{background:var(--bg-card);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;border:1px solid var(--border)}
  .cover{position:relative;aspect-ratio:4/3;background:var(--bg-elev);display:flex;align-items:center;justify-content:center;font-size:2.2rem;overflow:hidden}
  .cover img{width:100%;height:100%;object-fit:cover}
  .badge{position:absolute;top:6px;font-weight:700;font-size:.72rem;padding:3px 7px;border-radius:8px;color:#1c1410;box-shadow:0 1px 4px rgba(0,0,0,.25)}
  .badge.rating{left:6px}
  .badge.abv{right:6px;background:rgba(255,255,255,.85);color:#1c1410}
  [data-theme="dark"] .badge.abv{background:rgba(0,0,0,.55);color:#f1e9df}
  .body{padding:9px 10px 11px;display:flex;flex-direction:column;gap:4px}
  .name-row{display:flex;align-items:baseline;gap:6px}
  .name-row .flag{font-size:1rem;cursor:text;outline:none;border-radius:4px;padding:0 2px}
  .name-row .flag:focus{background:var(--bg-elev)}
  .name{font-weight:700;font-size:.94rem;line-height:1.2}
  .meta{font-size:.76rem;color:var(--text-dim)}
  .empty{text-align:center;color:var(--text-dim);padding:60px 20px;grid-column:1/-1}

  #fab{position:fixed;right:18px;bottom:22px;z-index:25;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#1c1410;border:none;font-size:1.6rem;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:filter .1s,transform .1s}
  #fab:active{filter:brightness(0.9);transform:scale(0.95)}
  #uacFab{position:fixed;right:18px;bottom:88px;z-index:25;width:56px;height:56px;border-radius:50%;background:#fff;color:#000;border:none;font-size:.78rem;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:filter .1s,transform .1s}
  #uacFab:active{filter:brightness(0.9);transform:scale(0.95)}
  #uacOverlay{position:fixed;inset:0;background:#fff;z-index:95;display:none;align-items:center;justify-content:center}
  #uacOverlay.show{display:flex}
  #uacOverlay .uacText{color:#000;font-size:32vw;font-weight:900;letter-spacing:.02em;line-height:1}
  #uacClose{position:absolute;top:16px;right:16px;background:none;border:none;color:#000;font-size:1.8rem;cursor:pointer;padding:8px;line-height:1}

  .overlay{position:fixed;inset:0;background:var(--overlay);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .overlay.show{display:flex}
  @media (min-width:560px){.overlay{align-items:center}}
  .sheet{background:var(--bg);width:100%;max-width:480px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 18px 24px}
  @media (min-width:560px){.sheet{border-radius:18px}}
  .sheetHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .sheetHead h2{margin:0;font-size:1.1rem}
  .closeX{background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--text-dim)}
  form{display:flex;flex-direction:column;gap:10px}
  label{font-size:.75rem;color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px;display:block}
  .hint{font-size:.72rem;color:var(--text-dim);font-style:italic}
  .field{display:flex;flex-direction:column}
  .twoCol{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .threeCol{display:grid;grid-template-columns:0.7fr 1fr 1fr;gap:10px}
  .threeCol .field{min-width:0}
  .threeCol input{width:100%;min-width:0}
  .switch{position:relative;display:inline-block;width:44px;height:26px}
  .switch input{opacity:0;width:0;height:0}
  .switch .slider{position:absolute;inset:0;background:var(--border);transition:.15s;border-radius:999px;cursor:pointer}
  .switch .slider:before{content:"";position:absolute;height:20px;width:20px;left:3px;top:3px;background:#fff;transition:.15s;border-radius:50%}
  .switch input:checked + .slider{background:var(--accent)}
  .switch input:checked + .slider:before{transform:translateX(18px)}
  .priceField{position:relative}
  .priceField .euro{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-dim);pointer-events:none}
  .priceField input{padding-left:24px;width:100%}
  .flagCountry{display:grid;grid-template-columns:56px 1fr;gap:8px}
  .ratingButtons{display:flex;gap:3px}
  .ratingBtn{flex:1;min-width:0;height:28px;padding:0;border-radius:6px;border:1px solid var(--border);background:var(--bg-elev);color:var(--text-dim);font-weight:700;font-size:.7rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .ratingBtn.active{color:#1c1410;border-color:transparent}
  textarea{resize:vertical;min-height:56px}

  .viewCarousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:12px;margin-bottom:14px;background:var(--bg-elev)}
  .viewCarousel img{flex:0 0 100%;scroll-snap-align:center;width:100%;height:340px;object-fit:cover;cursor:pointer}
  .viewCarousel .placeholder{flex:0 0 100%;height:340px;display:flex;align-items:center;justify-content:center;font-size:3rem}
  .viewStats{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
  .viewTitleRow{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .viewTitle{display:flex;align-items:center;gap:8px;font-size:1.25rem;font-weight:700;min-width:0}
  .viewMeta{color:var(--text-dim);font-size:.9rem}
  .viewBadges{display:flex;gap:8px}
  .viewBadges span{padding:4px 11px;border-radius:8px;font-weight:700;font-size:.85rem}
  .viewComment{white-space:pre-wrap;font-size:.92rem;line-height:1.45}
  .viewReviews{max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
  .reviewRow{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
  .reviewRow:last-child{border-bottom:none}
  .reviewBody{flex:1;min-width:0}
  .reviewHead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .reviewHead .userName{font-weight:700;font-size:.88rem}
  .reviewStars{font-size:.78rem;color:var(--text-dim);white-space:nowrap;flex:0 0 auto}
  .reviewComment{font-size:.85rem;color:var(--text);margin-top:2px;white-space:pre-wrap;overflow-wrap:break-word}

  #photoStrip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
  .thumb{position:relative;flex:0 0 auto;width:74px;height:74px;border-radius:10px;overflow:hidden;background:var(--bg-elev);border:1px solid var(--border)}
  .thumb img{width:100%;height:100%;object-fit:cover;cursor:pointer}
  .thumb .rm{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:.65rem;cursor:pointer;line-height:1}
  .addThumb{flex:0 0 auto;width:74px;height:74px;border-radius:10px;border:1.5px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:var(--text-dim);cursor:pointer;background:none}

  .formActions{display:flex;gap:10px;margin-top:6px}
  .btn{flex:1;border:none;border-radius:10px;padding:12px;font-weight:700;font-size:.92rem;cursor:pointer;transition:filter .1s,transform .1s}
  .btn:active{filter:brightness(0.82);transform:scale(0.97)}
  .btn.primary{background:var(--accent);color:#1c1410}
  .btn.ghost{background:var(--bg-elev);color:var(--text);border:1px solid var(--border)}
  .btn.danger{background:none;color:var(--danger);flex:0 0 auto}
  .viewEditBtnInline{flex:0 0 auto;align-self:stretch;width:auto;padding:0 14px;font-size:.78rem;white-space:nowrap;display:flex;align-items:center;justify-content:center}

  #lightbox{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:80;flex-direction:column}
  #lightbox.show{display:flex}
  #lightbox img{max-width:92vw;max-height:74vh;object-fit:contain;border-radius:8px}
  .lbBar{position:absolute;top:16px;left:0;right:0;display:flex;justify-content:flex-end;padding:0 16px}
  .lbBar button{background:rgba(255,255,255,.15);border:none;color:#fff;width:38px;height:38px;border-radius:50%;font-size:1.1rem;cursor:pointer}
  .lbNav{position:absolute;top:50%;transform:translateY(-50%);display:flex;justify-content:space-between;left:0;right:0;padding:0 10px}
  .lbNav button{background:rgba(255,255,255,.15);border:none;color:#fff;width:42px;height:42px;border-radius:50%;font-size:1.2rem;cursor:pointer}

  #confirmModal .sheet{max-width:340px}

  .bigAvatarBtn{width:84px;height:84px;border-radius:50%;border:2px dashed var(--border);background:var(--bg-elev);display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:700;color:var(--text-dim);cursor:pointer;overflow:hidden;margin:0 auto 4px;padding:0}
  .bigAvatarBtn img{width:100%;height:100%;object-fit:cover}
  .myProfileSection{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--border)}
  .profileViewSection{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:16px}
  .profileViewSection .bigAvatarBtn{margin-bottom:6px}
  .profileViewName{font-size:1.2rem;font-weight:700}
  .profileViewBadge{font-size:.9rem;color:var(--text-dim)}
  .profileViewStats{font-size:.78rem;color:var(--text-dim);opacity:.8;margin-top:2px}
  #profileViewListWrap{border-top:1px solid var(--border);padding-top:16px;margin-top:4px}
  .badgeLadder{display:flex;flex-direction:column;gap:6px}
  .badgeSummary{font-size:.8rem;color:var(--text-dim);margin-bottom:2px}
  .badgeTier{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg-elev);font-size:.85rem;color:var(--text-dim)}
  .badgeTier.current{background:var(--accent);border-color:var(--accent);color:#1c1410;font-weight:700}
  .badgeTierName{display:flex;gap:6px;align-items:center}
  .badgeTierReq{font-size:.75rem}
  .userListHead{font-size:.75rem;color:var(--text-dim);font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px}
  .userRow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
  .userRow:last-child{border-bottom:none}
  .userAvatar{width:40px;height:40px;border-radius:50%;overflow:hidden;background:var(--bg-elev);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--text-dim);flex:0 0 auto}
  .userAvatar img{width:100%;height:100%;object-fit:cover}
  .userName{font-weight:700;font-size:.9rem}
  .userBadge{font-size:.78rem;color:var(--text-dim)}
  .userStats{font-size:.72rem;color:var(--text-dim);opacity:.8;margin-top:1px}
  .adminTag{display:inline-block;padding:1px 7px;border:1px solid var(--accent);border-radius:999px;font-size:.65rem;font-weight:700;color:var(--accent);vertical-align:middle}
  #confirmModal p{margin:0 0 16px;font-size:.92rem}

  #toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.85rem;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s;z-index:90}
  #toast.show{opacity:1}
</style>
</head>
<body>

<header>
  <h1><img src="img/logo.png" alt="" class="logo"><span>A legszebb öröm a Söröm</span></h1>
  <div class="headerRight">
    <button id="themeBtn" title="Toggle theme">🌙</button>
    <button id="profileBtn" class="avatarBtn" title="Profile"></button>
  </div>
</header>

<div id="toolbar">
  <div class="row">
    <input id="searchInput" type="search" placeholder="Search name, brewery, country, notes…">
  </div>
  <div class="row">
    <select id="sortSelect">
      <option value="newest">New -> Old</option>
      <option value="oldest">Old -> New</option>
      <option value="name">Name A–Z</option>
      <option value="rating-desc">Rating high→low</option>
      <option value="rating-asc">Rating low→high</option>
    </select>
    <select id="typeSelect">
      <option value="">All types</option>
    </select>
  </div>
</div>

<div id="beerList"></div>
<button id="uacFab" title="UAC">UAC</button>
<button id="fab" title="Add beer">+</button>

<div id="uacOverlay">
  <button id="uacClose">✕</button>
  <div class="uacText">UAC</div>
</div>

<div class="overlay" id="viewOverlay">
  <div class="sheet">
    <div class="sheetHead">
      <h2>Beer</h2>
      <button class="closeX" id="viewClose">✕</button>
    </div>
    <div class="viewCarousel" id="viewCarousel"></div>
    <div class="viewStats" id="viewStats"></div>
    <div class="field">
      <label>Your rating</label>
      <div class="ratingButtons" id="viewRatingButtons"></div>
    </div>
    <div class="field" style="margin-top:14px">
      <label>Your review</label>
      <textarea id="viewReviewInput" placeholder="What did you think?"></textarea>
      <button type="button" class="btn primary" id="viewReviewPostBtn" style="margin-top:8px">Post review</button>
    </div>
    <div class="field" style="margin-top:14px">
      <label>Reviews</label>
      <div class="viewReviews" id="viewReviews"></div>
    </div>
  </div>
</div>

<div class="overlay" id="formOverlay">
  <div class="sheet">
    <div class="sheetHead">
      <h2 id="formTitle">Add Beer</h2>
      <button class="closeX" id="formClose">✕</button>
    </div>
    <div id="photoStrip"></div>
    <input type="file" id="photoInput" accept="image/*" multiple style="display:none">
    <form id="beerForm">
      <div class="field">
        <label>Name</label>
        <input id="fName" required placeholder="e.g. Zlatý Bažant">
      </div>
      <div class="field">
        <label>Brewery</label>
        <input id="fBrewery" placeholder="e.g. Heineken Slovensko">
      </div>
      <div class="flagCountry">
        <div class="field">
          <label>Flag</label>
          <input id="fFlag" maxlength="8" placeholder="🏳️">
        </div>
        <div class="field">
          <label>Country</label>
          <input id="fCountry" placeholder="e.g. Slovakia">
        </div>
      </div>
      <div class="twoCol">
        <div class="field">
          <label>Beer type</label>
          <input id="fType" list="typeList" placeholder="e.g. Lager">
          <datalist id="typeList"></datalist>
        </div>
        <div class="field">
          <label>Filtered</label>
          <label class="switch">
            <input type="checkbox" id="fFiltered">
            <span class="slider"></span>
          </label>
        </div>
      </div>
      <div class="threeCol">
        <div class="field">
          <label>Degree (°)</label>
          <input id="fDegree" type="number" step="1" min="0" placeholder="11">
        </div>
        <div class="field">
          <label>ALC %</label>
          <input id="fAbv" type="number" step="0.1" min="0" max="100" placeholder="5.0">
        </div>
        <div class="field">
          <label>Price</label>
          <div class="priceField">
            <span class="euro">€</span>
            <input id="fPrice" type="number" step="0.1" min="0" placeholder="0.00">
          </div>
        </div>
      </div>
      <div class="field" style="margin-top:-4px">
        <span class="hint">Degree gives an estimated ALC % — adjust it to match the label if needed</span>
      </div>
      <div class="field">
        <label>Your rating</label>
        <div class="ratingButtons" id="ratingButtons"></div>
      </div>
      <div class="field">
        <label>Comment</label>
        <textarea id="fComment" placeholder="Tasting notes…"></textarea>
      </div>
      <div class="formActions">
        <button type="button" class="btn danger" id="deleteBtn" style="display:none">Delete</button>
        <button type="button" class="btn ghost" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn primary" id="saveBtn">Add Beer</button>
      </div>
    </form>
  </div>
</div>

<div id="lightbox">
  <div class="lbBar">
    <button id="lbClose">✕</button>
  </div>
  <img id="lbImg" src="" alt="">
  <div class="lbNav">
    <button id="lbPrev">‹</button>
    <button id="lbNext">›</button>
  </div>
</div>

<div class="overlay" id="profileViewOverlay">
  <div class="sheet">
    <div class="sheetHead">
      <h2>Profile</h2>
      <button class="closeX" id="profileViewClose">✕</button>
    </div>
    <div class="profileViewSection">
      <div id="profileViewAvatar" class="bigAvatarBtn" style="cursor:default"></div>
      <div id="profileViewName" class="profileViewName"></div>
      <div id="profileViewBadge" class="profileViewBadge"></div>
      <div id="profileViewStats" class="profileViewStats"></div>
    </div>
    <div class="formActions" id="profileViewActions">
      <button type="button" class="btn primary" id="profileViewEditBtn">Edit</button>
    </div>
    <div id="profileViewListWrap">
      <div class="userListHead">All Drinkers</div>
      <div id="userList"></div>
    </div>
  </div>
</div>

<div class="overlay" id="profileEditOverlay">
  <div class="sheet">
    <div class="sheetHead">
      <h2>Edit Profile</h2>
      <button class="closeX" id="profileEditClose">✕</button>
    </div>
    <div class="myProfileSection" style="border-bottom:none;margin-bottom:0;padding-bottom:0">
      <button type="button" id="myAvatarBtn" class="bigAvatarBtn" title="Change photo"></button>
      <input type="file" id="profilePhotoInput" accept="image/*" style="display:none">
      <div class="field">
        <label>Name</label>
        <input id="profileNameInput" placeholder="Your name">
      </div>
      <button type="button" class="btn primary" id="profileSaveBtn">Save</button>
    </div>
    <div class="field" style="margin-top:16px">
      <label>Badge progress</label>
      <div id="badgeLadder" class="badgeLadder"></div>
    </div>
  </div>
</div>

<div class="overlay" id="confirmModal">
  <div class="sheet">
    <p id="confirmText">Are you sure?</p>
    <div class="formActions">
      <button class="btn ghost" id="confirmCancel">Cancel</button>
      <button class="btn primary" style="background:var(--danger);color:#fff" id="confirmOk">Delete</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

// ---------- Theme ----------
const themeBtn = document.getElementById('themeBtn');
function applyThemeIcon(){
  const t = document.documentElement.getAttribute('data-theme');
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
}
themeBtn.onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('beer-theme', next); } catch (e) {}
  applyThemeIcon();
};
applyThemeIcon();

// ---------- State ----------
let allBeers = [];
let editingId = null;
let pendingPhotos = []; // {file, url} for new beers not yet saved
let lbPhotos = [], lbIdx = 0;
let pendingDelete = null;

const beerList = document.getElementById('beerList');
const searchInput = document.getElementById('searchInput');
const sortSelect = document.getElementById('sortSelect');
const typeSelect = document.getElementById('typeSelect');
const typeList = document.getElementById('typeList');

const COMMON_TYPES = ['Lager','Pilsner','IPA','Pale Ale','Amber Ale','Stout','Porter','Wheat / Weizen','Sour','Belgian','Bock','Cider','Other'];

function ratingColor(r){
  const hue = Math.max(0, Math.min(120, ((r - 1) / 9) * 120));
  return `hsl(${hue},70%,55%)`;
}

function pushOverlayState(){
  history.pushState({ sorOverlay: true }, '');
}

function buildRatingButtons(container, value, onSelect){
  container.innerHTML = '';
  for (let n = 1; n <= 10; n++){
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'ratingBtn' + (n === value ? ' active' : '');
    btn.textContent = n;
    if (n === value) btn.style.background = ratingColor(n);
    btn.onclick = () => onSelect(n);
    container.appendChild(btn);
  }
}

async function submitMyRating(beerId, ratingValue){
  await beersCol.doc(beerId).collection('ratings').doc(myUid).set(
    { rating: ratingValue, userId: myUid, ts: Date.now() }, { merge: true }
  );
  const snap = await beersCol.doc(beerId).collection('ratings').get();
  const ratings = snap.docs.map(d => d.data().rating).filter(r => typeof r === 'number');
  const count = ratings.length;
  const avg = count ? ratings.reduce((a, b) => a + b, 0) / count : null;
  await beersCol.doc(beerId).update({ avgRating: avg, ratingCount: count });
  return { avgRating: avg, ratingCount: count };
}

async function getMyRatingFor(beerId){
  try {
    const doc = await beersCol.doc(beerId).collection('ratings').doc(myUid).get();
    return doc.exists ? doc.data().rating : null;
  } catch (e) { return null; }
}

async function submitMyReview(beerId, commentText){
  await beersCol.doc(beerId).collection('ratings').doc(myUid).set(
    { comment: commentText, userId: myUid, ts: Date.now() }, { merge: true }
  );
}

// ---------- Render ----------
function distinctTypes(){
  const set = new Set(COMMON_TYPES);
  allBeers.forEach(b => { if (b.beerType) set.add(b.beerType); });
  return [...set].sort();
}
function renderFilters(){
  const curType = typeSelect.value;
  typeSelect.innerHTML = '<option value="">All types</option>' +
    distinctTypes().map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('');
  typeSelect.value = curType;

  typeList.innerHTML = distinctTypes().map(t => `<option value="${escapeHtml(t)}">`).join('');
}

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function filteredSorted(){
  let list = allBeers.slice();
  const q = searchInput.value.trim().toLowerCase();
  if (q) list = list.filter(b => [b.name, b.brewery, b.country, b.comment].some(v => (v || '').toLowerCase().includes(q)));
  if (typeSelect.value) list = list.filter(b => b.beerType === typeSelect.value);
  switch (sortSelect.value) {
    case 'name': list.sort((a, b) => (a.name || '').localeCompare(b.name || '')); break;
    case 'rating-desc': list.sort((a, b) => (b.avgRating || 0) - (a.avgRating || 0)); break;
    case 'rating-asc': list.sort((a, b) => (a.avgRating || 0) - (b.avgRating || 0)); break;
    case 'oldest': list.sort((a, b) => (a.ts || 0) - (b.ts || 0)); break;
    default: list.sort((a, b) => (b.ts || 0) - (a.ts || 0));
  }
  return list;
}

function render(){
  const list = filteredSorted();
  if (!list.length){
    beerList.innerHTML = '<div class="empty">No beers yet 🍺<br>Tap + to add the first one.</div>';
    return;
  }
  beerList.innerHTML = list.map(b => {
    const cover = (b.photos && b.photos[0])
      ? `<img src="${escapeHtml(b.photos[0].url)}" alt="">`
      : '🍺';
    return `
    <div class="card" data-id="${b.id}">
      <div class="cover">
        ${cover}
        <span class="badge rating" style="background:${ratingColor(b.avgRating || 0)}">${b.avgRating != null ? b.avgRating.toFixed(1) : '–'}/10</span>
        ${b.abv != null ? `<span class="badge abv">${b.abv}%</span>` : ''}
      </div>
      <div class="body">
        <div class="name-row">
          <span class="flag" contenteditable="true" spellcheck="false" data-flag="${b.id}">${escapeHtml(b.flag || '🏳️')}</span>
          <span class="name">${escapeHtml(b.name || 'Unnamed')}</span>
        </div>
        <div class="meta">${escapeHtml(b.country || '')}${b.country && b.beerType ? ' · ' : ''}${escapeHtml(b.beerType || '')}</div>
      </div>
    </div>`;
  }).join('');

  beerList.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', (e) => {
      if (e.target.closest('.flag')) return;
      const beer = allBeers.find(b => b.id === card.dataset.id);
      if (beer) openView(beer);
    });
  });
}

function selectFlagContents(el){
  const range = document.createRange();
  range.selectNodeContents(el);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}
beerList.addEventListener('focusin', (e) => {
  const el = e.target.closest('.flag');
  if (el) selectFlagContents(el);
});
beerList.addEventListener('focusout', async (e) => {
  const el = e.target.closest('.flag');
  if (!el) return;
  const id = el.dataset.flag;
  const val = el.textContent.trim() || '🏳️';
  try { await beersCol.doc(id).update({ flag: val }); } catch (err) { showToast('Could not save flag'); }
});
beerList.addEventListener('keydown', (e) => {
  if (e.target.closest('.flag') && e.key === 'Enter'){ e.preventDefault(); e.target.blur(); }
});
beerList.addEventListener('click', (e) => {
  const el = e.target.closest('.flag');
  if (el){
    e.stopPropagation();
    setTimeout(() => selectFlagContents(el), 0);
  }
});

searchInput.oninput = render;
sortSelect.onchange = render;
typeSelect.onchange = render;

// ---------- Firestore live sync ----------
beersCol.onSnapshot(snap => {
  allBeers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderFilters();
  render();
  refreshViewIfOpen();
  refreshProfileDisplays();
}, err => showToast('Sync error: ' + err.message));

// ---------- Add/Edit form ----------
const formOverlay = document.getElementById('formOverlay');
const beerForm = document.getElementById('beerForm');
const formTitle = document.getElementById('formTitle');
const photoStrip = document.getElementById('photoStrip');
const photoInput = document.getElementById('photoInput');
const ratingButtonsEl = document.getElementById('ratingButtons');
const deleteBtn = document.getElementById('deleteBtn');
const fDegreeEl = document.getElementById('fDegree');
const fAbvEl = document.getElementById('fAbv');
let formRating = null;

fDegreeEl.addEventListener('input', () => {
  const degree = Number(fDegreeEl.value);
  if (fDegreeEl.value === '' || isNaN(degree) || degree <= 0) return;
  const estimatedAbv = Math.round((degree - 1) * 0.4 * 10) / 10;
  fAbvEl.value = estimatedAbv;
});

function renderRatingButtons(){
  buildRatingButtons(ratingButtonsEl, formRating, async (n) => {
    formRating = n;
    renderRatingButtons();
    if (editingId){
      try {
        await submitMyRating(editingId, n);
      } catch (err) {
        showToast('Rating failed: ' + err.message);
      }
    }
  });
}

function renderPhotoStrip(beer){
  photoStrip.innerHTML = '';
  const photos = (beer && beer.photos) || [];
  photos.forEach((p, i) => {
    const div = document.createElement('div');
    div.className = 'thumb';
    div.innerHTML = `<img src="${escapeHtml(p.url)}"><button class="rm" title="Remove">✕</button>`;
    div.querySelector('img').onclick = () => openLightbox(photos, i);
    div.querySelector('.rm').onclick = () => removeExistingPhoto(beer.id, p);
    photoStrip.appendChild(div);
  });
  pendingPhotos.forEach((pp, i) => {
    const div = document.createElement('div');
    div.className = 'thumb';
    div.innerHTML = `<img src="${pp.url}"><button class="rm" title="Remove">✕</button>`;
    div.querySelector('.rm').onclick = () => { pendingPhotos.splice(i, 1); renderPhotoStrip(beer); };
    photoStrip.appendChild(div);
  });
  const addTile = document.createElement('button');
  addTile.type = 'button';
  addTile.className = 'addThumb';
  addTile.textContent = '+';
  addTile.onclick = () => photoInput.click();
  photoStrip.appendChild(addTile);
}

photoInput.onchange = async () => {
  const files = Array.from(photoInput.files || []);
  photoInput.value = '';
  if (!files.length) return;
  if (editingId){
    try {
      for (const file of files) await uploadPhotoToBeer(editingId, file);
      const fresh = allBeers.find(b => b.id === editingId);
      renderPhotoStrip(fresh);
    } catch (err) {
      showToast('Photo upload failed: ' + err.message);
    }
  } else {
    files.forEach(file => pendingPhotos.push({ file, url: URL.createObjectURL(file) }));
    renderPhotoStrip(null);
  }
};

async function uploadPhotoToBeer(beerId, file){
  const path = `beers/${beerId}/${Date.now()}_${file.name}`;
  const ref = storage.ref(path);
  await ref.put(file);
  const url = await ref.getDownloadURL();
  await beersCol.doc(beerId).update({
    photos: firebase.firestore.FieldValue.arrayUnion({ url, path, ts: Date.now() })
  });
}

async function removeExistingPhoto(beerId, photoObj){
  try {
    await storage.ref(photoObj.path).delete();
  } catch (e) { /* file may already be gone */ }
  await beersCol.doc(beerId).update({
    photos: firebase.firestore.FieldValue.arrayRemove(photoObj)
  });
  const fresh = allBeers.find(b => b.id === beerId);
  const updatedPhotos = (fresh.photos || []).filter(p => p.path !== photoObj.path);
  renderPhotoStrip({ id: beerId, photos: updatedPhotos });
}

let formOpenedFromBeerId = null;
async function openForm(beer){
  formOpenedFromBeerId = beer ? beer.id : null;
  pushOverlayState();
  editingId = beer ? beer.id : null;
  pendingPhotos = [];
  formTitle.textContent = beer ? 'Edit Beer' : 'Add Beer';
  document.getElementById('saveBtn').textContent = beer ? 'Save' : 'Add Beer';
  deleteBtn.style.display = beer ? 'block' : 'none';

  document.getElementById('fName').value = beer?.name || '';
  document.getElementById('fBrewery').value = beer?.brewery || '';
  document.getElementById('fFlag').value = beer?.flag || '';
  document.getElementById('fCountry').value = beer?.country || '';
  document.getElementById('fType').value = beer?.beerType || '';
  document.getElementById('fFiltered').checked = !!beer?.filtered;
  document.getElementById('fDegree').value = beer?.degree ?? '';
  document.getElementById('fAbv').value = beer?.abv ?? '';
  document.getElementById('fPrice').value = beer?.price ?? '';
  formRating = null;
  renderRatingButtons();
  document.getElementById('fComment').value = beer?.comment || '';
  renderPhotoStrip(beer);

  formOverlay.classList.add('show');

  if (beer){
    const mine = await getMyRatingFor(beer.id);
    if (editingId === beer.id){
      formRating = mine;
      renderRatingButtons();
    }
  }
}
function hideForm(){
  formOverlay.classList.remove('show');
  pendingPhotos = [];
  editingId = null;
}
function closeForm(){ history.back(); }
document.getElementById('fab').onclick = () => openForm(null);

// ---------- UAC easter egg ----------
const uacOverlay = document.getElementById('uacOverlay');
function openUac(){
  pushOverlayState();
  uacOverlay.classList.add('show');
}
function hideUac(){ uacOverlay.classList.remove('show'); }
document.getElementById('uacFab').onclick = openUac;
document.getElementById('uacClose').onclick = () => history.back();
document.getElementById('formClose').onclick = closeForm;
document.getElementById('cancelBtn').onclick = closeForm;
formOverlay.addEventListener('click', (e) => { if (e.target === formOverlay) closeForm(); });

beerForm.onsubmit = async (e) => {
  e.preventDefault();
  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true;
  const data = {
    name: document.getElementById('fName').value.trim(),
    brewery: document.getElementById('fBrewery').value.trim(),
    flag: document.getElementById('fFlag').value.trim() || '🏳️',
    country: document.getElementById('fCountry').value.trim(),
    beerType: document.getElementById('fType').value.trim(),
    filtered: document.getElementById('fFiltered').checked,
    degree: document.getElementById('fDegree').value === '' ? null : Number(document.getElementById('fDegree').value),
    abv: document.getElementById('fAbv').value === '' ? null : Number(document.getElementById('fAbv').value),
    price: document.getElementById('fPrice').value === '' ? null : Number(document.getElementById('fPrice').value),
    comment: document.getElementById('fComment').value.trim()
  };
  try {
    if (editingId){
      await beersCol.doc(editingId).update(data);
      showToast('Beer updated');
    } else {
      data.photos = [];
      data.ts = Date.now();
      data.createdBy = myUid;
      const ref = await beersCol.add(data);
      for (const pp of pendingPhotos) await uploadPhotoToBeer(ref.id, pp.file);
      if (formRating != null) await submitMyRating(ref.id, formRating);
      showToast('Beer added');
    }
    closeForm();
  } catch (err) {
    showToast('Save failed: ' + err.message);
  } finally {
    saveBtn.disabled = false;
  }
};

// ---------- Delete beer ----------
function confirmDeleteBeer(beer){
  askConfirm(`Delete "${beer.name || 'this beer'}"? Its photos will be removed too.`, async () => {
    for (const p of (beer.photos || [])){
      try { await storage.ref(p.path).delete(); } catch (e) {}
    }
    const ratingsSnap = await beersCol.doc(beer.id).collection('ratings').get();
    for (const doc of ratingsSnap.docs){
      try { await doc.ref.delete(); } catch (e) {}
    }
    await beersCol.doc(beer.id).delete();
    showToast('Beer deleted');
  });
}
deleteBtn.onclick = () => {
  const beer = allBeers.find(b => b.id === editingId);
  if (!beer) return;
  confirmDeleteBeer(beer);
};

// ---------- Confirm modal ----------
const confirmModal = document.getElementById('confirmModal');
const confirmText = document.getElementById('confirmText');
function askConfirm(msg, fn){
  confirmText.textContent = msg;
  pendingDelete = fn;
  confirmModal.classList.add('show');
}
document.getElementById('confirmCancel').onclick = () => { confirmModal.classList.remove('show'); pendingDelete = null; };
document.getElementById('confirmOk').onclick = async () => {
  const fn = pendingDelete;
  confirmModal.classList.remove('show');
  pendingDelete = null;
  if (fn) await fn();
  history.back();
};

// ---------- Lightbox ----------
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
function openLightbox(photos, idx){
  pushOverlayState();
  lbPhotos = photos; lbIdx = idx;
  lbImg.src = photos[idx].url;
  lightbox.classList.add('show');
}
function hideLightbox(){ lightbox.classList.remove('show'); }
function lbShow(){ lbImg.src = lbPhotos[lbIdx].url; }
document.getElementById('lbClose').onclick = () => history.back();
document.getElementById('lbPrev').onclick = () => { lbIdx = (lbIdx - 1 + lbPhotos.length) % lbPhotos.length; lbShow(); };
document.getElementById('lbNext').onclick = () => { lbIdx = (lbIdx + 1) % lbPhotos.length; lbShow(); };

let lbTouchStartX = null;
let lbTouchStartY = null;
lightbox.addEventListener('touchstart', (e) => {
  const t = e.touches[0];
  lbTouchStartX = t.clientX;
  lbTouchStartY = t.clientY;
}, { passive: true });
lightbox.addEventListener('touchend', (e) => {
  if (lbTouchStartX == null || lbPhotos.length < 2) { lbTouchStartX = null; return; }
  const t = e.changedTouches[0];
  const dx = t.clientX - lbTouchStartX;
  const dy = t.clientY - lbTouchStartY;
  lbTouchStartX = null;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)){
    lbIdx = dx < 0 ? (lbIdx + 1) % lbPhotos.length : (lbIdx - 1 + lbPhotos.length) % lbPhotos.length;
    lbShow();
  }
}, { passive: true });

// ---------- View (read-only) ----------
const viewOverlay = document.getElementById('viewOverlay');
const viewCarousel = document.getElementById('viewCarousel');
const viewStats = document.getElementById('viewStats');
const viewRatingButtonsEl = document.getElementById('viewRatingButtons');
const viewReviewsEl = document.getElementById('viewReviews');
const viewReviewInput = document.getElementById('viewReviewInput');
const viewReviewPostBtn = document.getElementById('viewReviewPostBtn');
let currentViewId = null;
let currentViewBeer = null;
let myViewRating = null;
let viewRatingsUnsub = null;
let viewReviewInputTouched = false;

function renderReviewsList(ratingsDocs){
  const reviews = ratingsDocs.filter(r => (r.comment || '').trim().length > 0);
  if (!reviews.length){
    viewReviewsEl.innerHTML = '<div class="empty" style="padding:14px 0">No reviews yet</div>';
    return;
  }
  reviews.sort((a, b) => (b.ts || 0) - (a.ts || 0));
  viewReviewsEl.innerHTML = reviews.map(r => {
    const u = allUsers.find(x => x.id === r.userId);
    return `<div class="reviewRow">
      <div class="userAvatar">${avatarInner(u?.name, u?.photoURL)}</div>
      <div class="reviewBody">
        <div class="reviewHead">
          <span class="userName">${escapeHtml(u?.name || 'Anonymous')}</span>
          ${r.rating != null ? `<span class="reviewStars">⭐ ${r.rating}/10</span>` : ''}
        </div>
        <div class="reviewComment">${escapeHtml(r.comment)}</div>
      </div>
    </div>`;
  }).join('');
}

function renderViewStats(beer){
  const canEdit = !beer.createdBy || beer.createdBy === myUid || isAdmin();
  viewStats.innerHTML = `
    <div class="viewTitleRow">
      <div class="viewTitle"><span>${escapeHtml(beer.flag || '🏳️')}</span><span>${escapeHtml(beer.name || 'Unnamed')}</span></div>
      ${canEdit ? `<button type="button" class="btn primary viewEditBtnInline" id="viewEditBtnInline">Edit</button>` : ''}
    </div>
    <div class="viewMeta">${[escapeHtml(beer.brewery || ''), escapeHtml(beer.country || ''), escapeHtml(beer.beerType || '')].filter(Boolean).join(' · ')}</div>
    <div class="viewBadges">
      <span style="background:${ratingColor(beer.avgRating || 0)};color:#1c1410">${beer.avgRating != null ? beer.avgRating.toFixed(1) : '–'}/10${beer.ratingCount ? ` (${beer.ratingCount})` : ''}</span>
      ${beer.degree != null ? `<span style="background:var(--bg-elev);color:var(--text);border:1px solid var(--border)">${beer.degree}°</span>` : ''}
      ${beer.abv != null ? `<span style="background:var(--bg-elev);color:var(--text);border:1px solid var(--border)">${beer.abv}% ALC</span>` : ''}
      ${beer.price != null ? `<span style="background:var(--bg-elev);color:var(--text);border:1px solid var(--border)">€${beer.price}</span>` : ''}
      ${beer.filtered != null ? `<span style="background:var(--bg-elev);color:var(--text);border:1px solid var(--border)">${beer.filtered ? 'Filtered' : 'Unfiltered'}</span>` : ''}
    </div>
    ${beer.comment ? `<div class="viewComment">${escapeHtml(beer.comment)}</div>` : ''}
  `;
}

function refreshViewIfOpen(){
  if (!viewOverlay.classList.contains('show') || !currentViewId) return;
  const fresh = allBeers.find(b => b.id === currentViewId);
  if (!fresh) return;
  currentViewBeer = fresh;
  renderViewStats(fresh);
}

function renderViewRatingButtons(){
  buildRatingButtons(viewRatingButtonsEl, myViewRating, async (n) => {
    const beerId = currentViewId;
    myViewRating = n;
    renderViewRatingButtons();
    try {
      const result = await submitMyRating(beerId, n);
      if (currentViewId === beerId && currentViewBeer){
        currentViewBeer = { ...currentViewBeer, avgRating: result.avgRating, ratingCount: result.ratingCount };
        renderViewStats(currentViewBeer);
      }
    } catch (err) {
      showToast('Rating failed: ' + err.message);
    }
  });
}

async function showView(beer){
  currentViewId = beer.id;
  currentViewBeer = beer;
  const photos = beer.photos || [];
  viewCarousel.innerHTML = photos.length
    ? photos.map((p, i) => `<img src="${escapeHtml(p.url)}" data-i="${i}">`).join('')
    : '<div class="placeholder">🍺</div>';
  viewCarousel.querySelectorAll('img').forEach(img => {
    img.onclick = () => openLightbox(photos, Number(img.dataset.i));
  });
  renderViewStats(beer);
  myViewRating = null;
  renderViewRatingButtons();
  viewReviewInput.value = '';
  viewReviewInputTouched = false;
  viewReviewsEl.innerHTML = '';
  viewOverlay.classList.add('show');

  if (viewRatingsUnsub) { viewRatingsUnsub(); viewRatingsUnsub = null; }
  viewRatingsUnsub = beersCol.doc(beer.id).collection('ratings').onSnapshot(snap => {
    const docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderReviewsList(docs);
    const mine = docs.find(d => d.id === myUid);
    myViewRating = mine?.rating ?? null;
    renderViewRatingButtons();
    if (!viewReviewInputTouched) viewReviewInput.value = mine?.comment || '';
  }, err => showToast('Sync error: ' + err.message));
}
function openView(beer){
  pushOverlayState();
  return showView(beer);
}
function hideView(){
  viewOverlay.classList.remove('show');
  currentViewId = null;
  currentViewBeer = null;
  if (viewRatingsUnsub) { viewRatingsUnsub(); viewRatingsUnsub = null; }
}
function closeView(){ history.back(); }
viewReviewInput.addEventListener('input', () => { viewReviewInputTouched = true; });
viewReviewPostBtn.onclick = async () => {
  const beerId = currentViewId;
  try {
    await submitMyReview(beerId, viewReviewInput.value.trim());
    viewReviewInputTouched = false;
    showToast('Review posted');
  } catch (err) {
    showToast('Review failed: ' + err.message);
  }
};
document.getElementById('viewClose').onclick = closeView;
viewOverlay.addEventListener('click', (e) => { if (e.target === viewOverlay) closeView(); });
viewStats.addEventListener('click', (e) => {
  if (!e.target.closest('#viewEditBtnInline')) return;
  const beer = allBeers.find(b => b.id === currentViewId);
  hideView();
  if (beer) openForm(beer);
});

// ---------- Users / Profile ----------
const usersCol = db.collection('users');
const TIERS = [
  { min: 0, emoji: '🍼', label: 'Rookie' },
  { min: 3, emoji: '😌', label: 'Casual Drinker' },
  { min: 7, emoji: '🍻', label: 'Enthusiast' },
  { min: 13, emoji: '🧐', label: 'Beer Snob' },
  { min: 21, emoji: '🎖️', label: 'Veteran' },
  { min: 31, emoji: '🧙', label: 'Beer Wizard' },
  { min: 46, emoji: '🍺', label: 'Alcoholic' },
  { min: 61, emoji: '🏆', label: 'Legend' },
  { min: 80, emoji: '🚑', label: 'Liability' }
];

function getTierForTotal(total){
  let current = TIERS[0];
  for (const t of TIERS){ if (total >= t.min) current = t; else break; }
  return current;
}

function getUserStats(userId){
  const beersUploaded = allBeers.filter(b => b.createdBy === userId).length;
  const mine = allRatings.filter(r => r.userId === userId);
  const ratingsGiven = mine.filter(r => typeof r.rating === 'number').length;
  const reviewsWritten = mine.filter(r => (r.comment || '').trim().length > 0).length;
  const total = beersUploaded + ratingsGiven + reviewsWritten;
  return { beersUploaded, ratingsGiven, reviewsWritten, total, tier: getTierForTotal(total) };
}

function getMyUid(){
  let uid = localStorage.getItem('sor-uid');
  if (!uid){
    uid = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('u-' + Date.now() + '-' + Math.random().toString(36).slice(2));
    localStorage.setItem('sor-uid', uid);
  }
  return uid;
}
const myUid = getMyUid();
const ADMIN_UID = 'd1f2adc9-8d6e-4656-930b-b47e71a2cbf9'; // Óki — can edit/delete any beer regardless of who created it
function isAdmin(){ return myUid === ADMIN_UID; }
let allUsers = [];
let allRatings = [];

const profileViewOverlay = document.getElementById('profileViewOverlay');
const profileViewAvatar = document.getElementById('profileViewAvatar');
const profileViewName = document.getElementById('profileViewName');
const profileViewBadge = document.getElementById('profileViewBadge');
const profileViewStats = document.getElementById('profileViewStats');
const profileViewActions = document.getElementById('profileViewActions');
const profileViewListWrap = document.getElementById('profileViewListWrap');
const profileEditOverlay = document.getElementById('profileEditOverlay');
const profileBtn = document.getElementById('profileBtn');
const myAvatarBtn = document.getElementById('myAvatarBtn');
const profilePhotoInput = document.getElementById('profilePhotoInput');
const profileNameInput = document.getElementById('profileNameInput');
const badgeLadderEl = document.getElementById('badgeLadder');
const userListEl = document.getElementById('userList');
let currentProfileViewId = null;

function avatarInner(name, photoURL){
  if (photoURL) return `<img src="${escapeHtml(photoURL)}" alt="">`;
  const letter = (name || '').trim().charAt(0).toUpperCase() || '?';
  return escapeHtml(letter);
}

function renderHeaderAvatar(){
  const me = allUsers.find(u => u.id === myUid);
  profileBtn.innerHTML = avatarInner(me?.name, me?.photoURL);
}

function renderUserList(){
  if (!allUsers.length){
    userListEl.innerHTML = '<div class="empty" style="padding:16px 0">No drinkers yet 🍺</div>';
    return;
  }
  userListEl.innerHTML = allUsers.map(u => {
    const stats = getUserStats(u.id);
    return `<div class="userRow" data-user="${u.id}">
      <div class="userAvatar">${avatarInner(u.name, u.photoURL)}</div>
      <div>
        <div class="userName">${escapeHtml(u.name || 'Anonymous')}${u.id === ADMIN_UID ? ' <span class="adminTag">Admin</span>' : ''}</div>
        <div class="userBadge">${stats.tier.emoji} ${escapeHtml(stats.tier.label)}</div>
        <div class="userStats">${stats.beersUploaded} beers · ${stats.ratingsGiven} ratings · ${stats.reviewsWritten} reviews</div>
      </div>
    </div>`;
  }).join('');
  userListEl.querySelectorAll('.userRow').forEach(row => {
    row.style.cursor = 'pointer';
    row.onclick = () => openProfileView(row.dataset.user);
  });
}

function renderBadgeLadder(userId){
  const stats = getUserStats(userId);
  badgeLadderEl.innerHTML =
    `<div class="badgeSummary">Your total: ${stats.total} (${stats.beersUploaded} beers · ${stats.ratingsGiven} ratings · ${stats.reviewsWritten} reviews)</div>` +
    TIERS.map(t => `<div class="badgeTier ${t.label === stats.tier.label ? 'current' : ''}">
      <span class="badgeTierName">${t.emoji} ${escapeHtml(t.label)}</span>
      <span class="badgeTierReq">${t.min}+</span>
    </div>`).join('');
}

function renderProfileView(userId, u){
  const stats = getUserStats(userId);
  profileViewAvatar.innerHTML = avatarInner(u?.name, u?.photoURL);
  profileViewName.textContent = u?.name || 'Anonymous';
  profileViewBadge.textContent = `${stats.tier.emoji} ${stats.tier.label}`;
  profileViewStats.textContent = `${stats.beersUploaded} beers · ${stats.ratingsGiven} ratings · ${stats.reviewsWritten} reviews`;
}

function refreshProfileDisplays(){
  if (profileViewOverlay.classList.contains('show')){
    if (currentProfileViewId === myUid) renderUserList();
    if (currentProfileViewId) renderProfileView(currentProfileViewId, allUsers.find(u => u.id === currentProfileViewId));
  }
  if (profileEditOverlay.classList.contains('show')) renderBadgeLadder(myUid);
}

usersCol.onSnapshot(snap => {
  allUsers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderHeaderAvatar();
  refreshProfileDisplays();
}, err => showToast('Sync error: ' + err.message));

db.collectionGroup('ratings').onSnapshot(snap => {
  allRatings = snap.docs.map(d => ({ id: d.id, beerId: d.ref.parent.parent.id, ...d.data() }));
  refreshProfileDisplays();
}, err => showToast('Sync error: ' + err.message));

function showProfileView(userId){
  currentProfileViewId = userId;
  const isMe = userId === myUid;
  renderProfileView(userId, allUsers.find(u => u.id === userId));
  profileViewActions.style.display = isMe ? 'flex' : 'none';
  profileViewListWrap.style.display = isMe ? 'block' : 'none';
  if (isMe) renderUserList();
  profileViewOverlay.classList.add('show');
}
function openProfileView(userId){
  pushOverlayState();
  showProfileView(userId);
}
function hideProfileView(){
  profileViewOverlay.classList.remove('show');
  currentProfileViewId = null;
}
function closeProfileView(){ history.back(); }
profileBtn.onclick = () => openProfileView(myUid);
document.getElementById('profileViewClose').onclick = closeProfileView;
profileViewOverlay.addEventListener('click', (e) => { if (e.target === profileViewOverlay) closeProfileView(); });

function openProfileEdit(){
  pushOverlayState();
  const me = allUsers.find(u => u.id === myUid);
  profileNameInput.value = me?.name || '';
  myAvatarBtn.innerHTML = avatarInner(me?.name, me?.photoURL);
  renderBadgeLadder(myUid);
  hideProfileView();
  profileEditOverlay.classList.add('show');
}
function hideProfileEdit(){ profileEditOverlay.classList.remove('show'); }
function closeProfileEdit(){ history.back(); }
document.getElementById('profileViewEditBtn').onclick = openProfileEdit;
document.getElementById('profileEditClose').onclick = closeProfileEdit;
profileEditOverlay.addEventListener('click', (e) => { if (e.target === profileEditOverlay) closeProfileEdit(); });

myAvatarBtn.onclick = () => profilePhotoInput.click();
profilePhotoInput.onchange = async () => {
  const file = profilePhotoInput.files[0];
  profilePhotoInput.value = '';
  if (!file) return;
  try {
    const path = `users/${myUid}/${Date.now()}_${file.name}`;
    const ref = storage.ref(path);
    await ref.put(file);
    const url = await ref.getDownloadURL();
    const me = allUsers.find(u => u.id === myUid);
    if (me?.photoPath){ try { await storage.ref(me.photoPath).delete(); } catch (e) {} }
    await usersCol.doc(myUid).set({ photoURL: url, photoPath: path }, { merge: true });
    myAvatarBtn.innerHTML = avatarInner(profileNameInput.value, url);
    showToast('Photo updated');
  } catch (err) {
    showToast('Photo upload failed: ' + err.message);
  }
};

document.getElementById('profileSaveBtn').onclick = async () => {
  const name = profileNameInput.value.trim();
  try {
    await usersCol.doc(myUid).set({ name }, { merge: true });
    showToast('Profile saved');
    closeProfileEdit();
  } catch (err) {
    showToast('Save failed: ' + err.message);
  }
};

// ---------- Back button navigation ----------
window.addEventListener('popstate', () => {
  if (uacOverlay.classList.contains('show')){
    hideUac();
    return;
  }
  if (lightbox.classList.contains('show')){
    hideLightbox();
    return;
  }
  if (confirmModal.classList.contains('show')){
    confirmModal.classList.remove('show');
    pendingDelete = null;
    return;
  }
  if (formOverlay.classList.contains('show')){
    hideForm();
    if (formOpenedFromBeerId){
      const beer = allBeers.find(b => b.id === formOpenedFromBeerId);
      if (beer) showView(beer);
    }
    return;
  }
  if (profileEditOverlay.classList.contains('show')){
    hideProfileEdit();
    showProfileView(myUid);
    return;
  }
  if (viewOverlay.classList.contains('show')){
    hideView();
    return;
  }
  if (profileViewOverlay.classList.contains('show')){
    if (currentProfileViewId && currentProfileViewId !== myUid){
      showProfileView(myUid);
    } else {
      hideProfileView();
    }
    return;
  }
});

// ---------- Toast ----------
let toastTimer;
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}
</script>
</body>
</html>
